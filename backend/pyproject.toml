[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.35.0",
    "fastapi>=0.136.1",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.9.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "requests>=2.32.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.47.0",
    "moto>=5.2.1",
    "groq>=1.2.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "piexif>=1.1.3",
    "numpy>=2.0.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.19.0",
    "tenacity>=9.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "cohere>=5.11.0",
    "sse-starlette>=2.1.0",
    "sentence-transformers>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
    "moto[s3]>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

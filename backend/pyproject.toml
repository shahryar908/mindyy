[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.9.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "requests>=2.32.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
